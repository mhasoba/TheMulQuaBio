name: Build and deploy book

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-execution.lock.txt

      - name: Install dependencies
        run: make init REQUIREMENTS_FILE=requirements-execution.lock.txt

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true

      - name: Install R workflow dependencies
        run: Rscript -e 'install.packages("reshape2", repos = "https://cloud.r-project.org")'

      - name: Check the R examples
        run: |
          Rscript scripts/check_r_observations.R
          Rscript scripts/check_r_file_workflows.R

      # Strict forced notebook execution is temporarily suspended. Restore it
      # through https://github.com/MulQuaBio/MQB/issues/205.
      - name: Check and build book
        env:
          MQB_NOTEBOOK_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          MQB_NOTEBOOK_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: PYTHONPATH="$GITHUB_WORKSPACE" make test

      - name: Upload built book
        uses: actions/upload-artifact@v7
        with:
          name: book-html
          path: content/_build/html
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download built book
        uses: actions/download-artifact@v8
        with:
          name: book-html
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
