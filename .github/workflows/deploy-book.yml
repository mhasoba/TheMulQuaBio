name: Build and deploy book

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install validation dependencies
        run: make init

      - name: Run fast content and stored-output checks
        run: |
          make check-content
          make check-notebooks

  build:
    needs: validate
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-execution.lock.txt

      - name: Install notebook execution dependencies
        run: make init REQUIREMENTS_FILE=requirements-execution.lock.txt

      - name: Register Python and Bash kernels
        run: |
          . .venv/bin/activate
          python -m ipykernel install --sys-prefix --name python3 --display-name "Python 3"
          python -m bash_kernel.install

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true

      - name: Install R dependencies and register the kernel
        env:
          CRAN_REPO: https://packagemanager.posit.co/cran/__linux__/noble/2026-10-01
        run: |
          . .venv/bin/activate
          Rscript -e 'options(repos = c(CRAN = Sys.getenv("CRAN_REPO"))); install.packages(readLines("requirements-r.txt"))'
          ir_kernel_spec=$(Rscript -e 'cat(system.file("kernelspec", package = "IRkernel"))')
          jupyter kernelspec install --sys-prefix --replace --name ir "$ir_kernel_spec"

      - name: Check the R examples
        run: |
          Rscript scripts/check_r_observations.R
          Rscript scripts/check_r_file_workflows.R

      - name: Execute notebooks and build book
        env:
          MQB_NOTEBOOK_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          MQB_NOTEBOOK_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: PYTHONPATH="$GITHUB_WORKSPACE" make test-strict

      - name: Upload built book
        uses: actions/upload-artifact@v7
        with:
          name: book-html
          path: content/_build/html
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download built book
        uses: actions/download-artifact@v8
        with:
          name: book-html
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
